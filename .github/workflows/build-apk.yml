name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare build environment
        run: |
          # Ensure .env file exists for Secrets Gradle Plugin
          if [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # Ensure debug.keystore exists (decode from base64 if present, or generate with keytool)
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              (base64 -d debug.keystore.base64 > debug.keystore) || (base64 --decode debug.keystore.base64 > debug.keystore) || true
            fi
          fi

          # Fallback: if debug.keystore is still missing, generate it with keytool
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating debug.keystore using keytool..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Keystore verification:"
          ls -la debug.keystore

          # Ensure gradlew has execution permissions
          chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crossword-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
